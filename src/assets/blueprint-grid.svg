<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <defs>
    <pattern id="blueprintGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#10b981" stroke-width="0.3" opacity="0.12"/>
    </pattern>
    <pattern id="blueprintDots" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="1.5" fill="#059669" opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="300" height="300" fill="url(#blueprintGrid)"/>
  <rect width="300" height="300" fill="url(#blueprintDots)"/>
  <line x1="150" y1="0" x2="150" y2="300" stroke="#059669" stroke-width="0.5" opacity="0.08"/>
  <line x1="0" y1="150" x2="300" y2="150" stroke="#059669" stroke-width="0.5" opacity="0.08"/>
  <circle cx="150" cy="150" r="80" fill="none" stroke="#059669" stroke-width="0.5" opacity="0.06"/>
  <circle cx="150" cy="150" r="40" fill="none" stroke="#059669" stroke-width="0.5" opacity="0.06"/>
</svg>