<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10b981" stroke-width="0.5" opacity="0.15"/>
    </pattern>
    <pattern id="blueprint" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="none"/>
      <circle cx="40" cy="40" r="30" fill="none" stroke="#059669" stroke-width="0.5" opacity="0.1"/>
      <circle cx="40" cy="40" r="15" fill="none" stroke="#059669" stroke-width="0.5" opacity="0.1"/>
      <line x1="10" y1="40" x2="70" y2="40" stroke="#059669" stroke-width="0.3" opacity="0.08"/>
      <line x1="40" y1="10" x2="40" y2="70" stroke="#059669" stroke-width="0.3" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#grid)"/>
  <rect width="400" height="400" fill="url(#blueprint)"/>
</svg>